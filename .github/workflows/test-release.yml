name: Build and publish test installers

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing prerelease to attach the test installers to
        required: true
        type: choice
        options:
          - v0.1.0-alpha.2
      build_windows:
        description: Build the Windows executable in this run
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: normogram-test-release
  cancel-in-progress: true

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Prepare test-only Firebase config and signing key
        working-directory: android
        run: |
          mkdir -p TMessagesProj/config
          keytool -genkeypair -noprompt -keystore TMessagesProj/config/release.keystore \
            -storepass android -keypass android -alias androidkey -keyalg RSA -keysize 2048 \
            -validity 3650 -dname "CN=NormoGram Test Build, OU=CI, O=NormoGram, L=Unknown, ST=Unknown, C=US"
          cat > TMessagesProj/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "normogram-test-build",
              "storage_bucket": "normogram-test-build.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:0000000000000000",
                "android_client_info": {"package_name": "org.normogram.messenger.web"}
              },
              "oauth_client": [],
              "api_key": [{"current_key": "test-build-placeholder"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }, {
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:1111111111111111",
                "android_client_info": {"package_name": "org.normogram.messenger"}
              },
              "oauth_client": [],
              "api_key": [{"current_key": "test-build-placeholder"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }, {
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:2222222222222222",
                "android_client_info": {"package_name": "org.telegram.messenger"}
              },
              "oauth_client": [],
              "api_key": [{"current_key": "test-build-placeholder"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          JSON
          cp TMessagesProj/google-services.json TMessagesProj_AppStandalone/google-services.json

      - name: Provide NormoGram API credentials
        working-directory: android
        env:
          NORMOGRAM_API_ID: ${{ secrets.NORMOGRAM_API_ID }}
          NORMOGRAM_API_HASH: ${{ secrets.NORMOGRAM_API_HASH }}
        run: |
          set -uo pipefail
          test -n "$NORMOGRAM_API_ID" || { echo "NORMOGRAM_API_ID secret is missing"; exit 1; }
          test -n "$NORMOGRAM_API_HASH" || { echo "NORMOGRAM_API_HASH secret is missing"; exit 1; }
          umask 077
          printf 'NORMOGRAM_API_ID=%s\nNORMOGRAM_API_HASH=%s\n' \
            "$NORMOGRAM_API_ID" "$NORMOGRAM_API_HASH" > local.properties

      - name: Build universal APK
        working-directory: android
        run: bash ./gradlew --no-daemon :TMessagesProj_AppStandalone:assembleAfatDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/TMessagesProj_AppStandalone/build/outputs/apk/afat/debug/app.apk
          if-no-files-found: error
          retention-days: 3

  windows:
    name: Build Windows EXE
    if: github.event_name != 'workflow_dispatch' || inputs.build_windows
    runs-on: windows-2025
    timeout-minutes: 360
    defaults:
      run:
        shell: cmd
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Visual Studio build environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          sdk: 10.0.26100.0
          toolset: 14.44

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Prepare Windows dependencies
        working-directory: windows
        run: Telegram\build\prepare\win.bat skip-release silent

      - name: Configure build
        working-directory: windows\Telegram
        env:
          NORMOGRAM_API_ID: ${{ secrets.NORMOGRAM_API_ID }}
          NORMOGRAM_API_HASH: ${{ secrets.NORMOGRAM_API_HASH }}
        run: |
          set -uo pipefail
          if not "%NORMOGRAM_API_ID%"=="" if not "%NORMOGRAM_API_HASH%"=="" (
            call configure.bat x64 -D TDESKTOP_API_ID=%NORMOGRAM_API_ID% -D TDESKTOP_API_HASH=%NORMOGRAM_API_HASH% -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON -D CMAKE_CONFIGURATION_TYPES=Debug
          ) else (
            echo NORMOGRAM_API_ID and NORMOGRAM_API_HASH secrets are required
            exit /b 1
          )

      - name: Compile Windows client
        working-directory: windows\Telegram
        run: cmake --build ..\out --config Debug --parallel

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: windows/out/Debug/Telegram.exe
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Attach installers to GitHub release
    needs: [android, windows]
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-24.04
    env:
      PREVIOUS_WINDOWS_RUN: 37696297957
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Rename Windows app for NormoGram
        run: |
          set -uo pipefail
          if [ -f release-assets/windows-exe/Telegram.exe ]; then
            mv release-assets/windows-exe/Telegram.exe release-assets/windows-exe/NormoGram.exe
            echo "using Windows build from this run"
            exit 0
          fi
          echo "Windows job did not run in this workflow run; fetching the executable from run $PREVIOUS_WINDOWS_RUN"
          mkdir -p release-assets/windows-exe
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$PREVIOUS_WINDOWS_RUN/artifacts" \
            -o artifacts.json
          artifact_id=$(grep -o '"id": *[0-9]*' artifacts.json | head -n 1 | tr -dc '0-9')
          test -n "$artifact_id" || { echo "no artifact found in the previous run"; exit 1; }
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            -o windows-artifact.zip
          unzip -o -q windows-artifact.zip -d release-assets/windows-exe
          mv release-assets/windows-exe/Telegram.exe release-assets/windows-exe/NormoGram.exe

      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.0-alpha.2' }}
        run: |
          printf '%s\n' \
            'Alpha build of NormoGram, an unofficial open-source Telegram client.' \
            '' \
            'Assets: universal Android APK and Windows x64 executable. Both clients are built with the project own Telegram api_id and api_hash supplied by the project owner through repository secrets.' \
            '' \
            'Known limitations of this alpha: the Android package is signed with a temporary CI key, the Firebase configuration is a placeholder, and push notifications are not configured yet. Desktop auto-update and crash reports are disabled.' \
            '' \
            'NormoGram is not affiliated with Telegram FZ-LLC and is not an official Telegram client.' \
            > release-notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "NormoGram $RELEASE_TAG — alpha build" --notes-file release-notes.md --prerelease
          else
            gh release create "$RELEASE_TAG" --title "NormoGram $RELEASE_TAG — alpha build" --notes-file release-notes.md --prerelease
          fi
          gh release upload "$RELEASE_TAG" \
            release-assets/android-apk/app.apk \
            release-assets/windows-exe/NormoGram.exe \
            --clobber
